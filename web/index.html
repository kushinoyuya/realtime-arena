<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Realtime Arena</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Realtime Arena</h1>
  <div class="sub">authoritative server · deterministic sim · zero dependencies</div>
  <div class="wrap">
    <canvas id="board" width="720" height="540"></canvas>
    <div class="panel">
      <h2>Scoreboard</h2>
      <div id="scores"></div>
      <div id="status" class="status">connecting…</div>
      <div class="hint">Move: <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><br>Open more tabs to add players.</div>
      <div class="hint"><a href="replay.html">Watch recorded matches →</a></div>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
